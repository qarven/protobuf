[package]
name = "protobuf"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Generated protobuf types and Connect stubs for the Oryon API surface"

[lib]
path = "lib.rs"

[dependencies]
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
connectrpc = "0.9.1"
serde = { version = "1", features = ["derive"] }
